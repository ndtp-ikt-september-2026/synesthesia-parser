[project]
name = "synesthesia-parser"
version = "0.1.0"
description = "Dual-engine music & gear scraper with Discogs harvesting, audio preview downloader, MiniLM embeddings, and OpenCart ingestion"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Synesthesia Parser Contributors" }
]
keywords = [
    "discogs",
    "music-scraper",
    "audio-downloader",
    "pop-music",
    "gear-scraper",
    "opencart",
    "vector-embeddings",
    "sentence-transformers",
    "textual",
    "tui"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "curl-cffi>=0.16.3",
    "fake-useragent>=2.2.0",
    "mutagen>=1.48.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
    "textual>=8.2.8",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
synesthesia = "main:main"
synesthesia-cli = "main:main"

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
